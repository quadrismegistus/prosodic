name: unit tests

on:
  workflow_call:      # invoked by stable-release.yml / release.yml / nonreleases.yml
  pull_request:        # run directly on PRs (incl. from forks/branches) so they're actually tested


jobs:
  python-unit:
    name: Python unit tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Windows leg validates espeak-ng detection on Windows (issue #62)
          # and Windows-safe multiprocessing (issue #74).
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install espeak (Linux)
        if: runner.os == 'Linux'
        run: sudo apt install espeak libespeak1 libespeak-dev -y

      # Installs to C:\Program Files\eSpeak NG\ — one of the paths prosodic's
      # set_espeak_env() checks at import, so this leg exercises the exact
      # Windows detection logic reported broken in issue #62.
      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo espeak-ng/espeak-ng --pattern '*.msi' --dir espeak-msi
          $msi = Get-ChildItem espeak-msi -Filter *.msi | Where-Object { $_.Name -match 'X64' } | Select-Object -First 1
          if (-not $msi) { $msi = Get-ChildItem espeak-msi -Filter *.msi | Select-Object -First 1 }
          Start-Process msiexec.exe -ArgumentList '/i', $msi.FullName, '/qn', '/norestart' -Wait
          if (-not (Test-Path 'C:\Program Files\eSpeak NG\libespeak-ng.dll')) {
            throw 'libespeak-ng.dll not found after espeak-ng install'
          }

      - name: Install Python dependencies
        run: |
          pip install -U pip wheel
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      # Cache the large Stanza constituency model (~500MB) so it downloads
      # once, not every run. Keyed on a version we bump when the model changes.
      - name: Cache Stanza models (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-models-en-v1

      # Both phrasal-stress engines, so syntax=True is actually exercised in CI
      # rather than skipped: spaCy (default) + Stanza (faithful L&P). Linux only
      # — the Windows leg targets espeak detection, and torch/Stanza there is
      # heavy and flaky; syntax tests skip gracefully without these installed.
      - name: Install syntax engines + models (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install 'spacy>=3.0' 'stanza>=1.5' 'hashstash[best]'
          python -m spacy download en_core_web_sm
          python -c "import stanza; stanza.download('en')"
          python -c "import stanza; stanza.Pipeline('en', processors='tokenize,pos,lemma,constituency,depparse', tokenize_no_ssplit=True, verbose=False)"

      # Lightweight lint: byte-compile the package to catch syntax errors.
      # Non-blocking (yapf's full diff isn't wired up as a dependency yet).
      - name: Lint (compile check)
        run: python -m compileall -q prosodic
        continue-on-error: true

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run pytest
        run: pytest --cov=prosodic --cov-report=xml
        env:
          NAPTIME: 30

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
