project:
  type: website
  output-dir: _build

execute:
  freeze: auto  # re-render only when source changes

# Generated by `quartodoc build` (run from this docs/ directory); see the
# `quartodoc` block at the bottom of this file. Regenerate whenever the
# public API changes.
metadata-files:
  - reference/_sidebar.yml

website:
  title: "prosodic"
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        file: index.qmd
      - text: "Install"
        file: install.qmd
      - text: "Web App"
        file: webapp.qmd
      - text: "Methods"
        menu:
          - text: "Metrical parsing"
            file: methods/metrical-parsing.qmd
          - text: "Foot parsing"
            file: methods/foot-parsing.md
          - text: "Rhyme detection"
            file: methods/rhyme.qmd
          - text: "Phrasal stress"
            file: methods/phrasal-stress.qmd
          - text: "Constituency backend (experimental)"
            file: methods/constituency-backend.qmd
          - text: "Phrasal stress & scansion (study)"
            file: methods/phrasal-stress-scansion.qmd
          - text: "Languages"
            file: methods/languages.qmd
      # Executable worked analyses; add future pages (prose rhythm, other
      # corpora) as further menu entries under docs/explorations/.
      - text: "Explorations"
        menu:
          - text: "Shakespeare's sonnets"
            file: explorations/sonnets.qmd
          - text: "Prose rhythm"
            file: explorations/prose.qmd
          - text: "The grammar of each meter"
            file: explorations/meters.qmd
      - text: "Architecture"
        file: architecture.qmd
      - text: "Reference"
        file: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/quadrismegistus/prosodic
        target: _blank

format:
  html:
    theme:
      light: litera
      dark: darkly
    toc: true

# --------------------------------------------------------------------------
# API reference (quartodoc). Run `quartodoc build` from this directory to
# (re)generate reference/*.qmd and reference/_sidebar.yml, then
# `quarto render` the site. quartodoc introspects the installed `prosodic`
# package, so keep it importable in the build environment.
# --------------------------------------------------------------------------
quartodoc:
  package: prosodic
  dir: reference
  title: "API reference"
  style: pkgdown
  sidebar: reference/_sidebar.yml
  render_interlinks: false
  sections:
    - title: "Text & hierarchy"
      desc: >
        A text is a lazily-built tree of linguistic entities over a
        syllable-level DataFrame.
      contents:
        - texts.texts.Text
        - texts.texts.TextModel
        - texts.stanzas.Stanza
        - texts.lines.Line
        - words.wordtoken.WordToken
        - words.wordform.WordForm
        - words.syllables.Syllable
        - words.phonemes.Phoneme
    - title: "Metrical parsing"
      desc: >
        The exhaustive, vectorized constraint-based parser and its
        MaxEnt weight learner.
      contents:
        - parsing.meter.Meter
        - parsing.parses.Parse
        - parsing.maxent.MaxEntTrainer
        - analysis.feet.parse_feet
        - analysis.feet.Foot
        - analysis.feet.FootList
    - title: "Poem-level analysis"
      desc: >
        Higher-order form classification over a parsed text (surfaced as
        TextModel properties).
      contents:
        - analysis.meter_type.classify_meter_type
        - analysis.line_scheme.detect_line_scheme
        - analysis.rhyme_scheme.match_rhyme_scheme
        - analysis.summary.summary
        - analysis.grid.grid_str
    - title: "Remote client"
      desc: >
        Duck-typed client for a Prosodic server (only `requests` required
        locally).
      contents:
        - client.set_server
        - client.get_server
        - client.RemoteText
