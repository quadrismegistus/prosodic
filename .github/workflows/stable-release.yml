name: "stable-release"

on:
  push:
    branches:
      - "main"
      - "master"

# Serialize release+deploy runs so rapid master pushes (e.g. merging a batch of
# PRs) don't launch concurrent deploys that race on the server (overlapping
# `npm run build` / `systemctl restart`). A newer pending run supersedes older
# pending ones, so the final run deploys the latest master.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  tests:
    uses: "./.github/workflows/unit-tests.yml"  # use the callable tests job to run tests
    secrets: inherit

  # NOTE: the GitHub release + PyPI upload used to live here, gated only on
  # `needs: [tests]` — every push to master published a new PyPI build. That
  # moved to release.yml, triggered on `v*` tags, so a PyPI release is now a
  # deliberate act (`git tag vX.Y.Z && git push --tags`). This workflow keeps
  # only what should run on every master push: tests + continuous deploy of
  # the live site.

  deploy:
    name: "Deploy to prosodic.app"
    needs: [tests]
    runs-on: "ubuntu-latest"
    steps:
      - name: SSH and update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # The server's `npm run build` rewrites tracked files under
          # prosodic/web/static_build/ (content-hashed chunk names), leaving
          # the working tree dirty after every deploy — so a plain `git pull`
          # aborts on the *next* deploy (this silently broke deploys #121–#126).
          # reset --hard + clean discards those build artifacts (regenerated
          # below anyway), and `npm ci` keeps package-lock.json pristine.
          script: |
            set -e
            cd /opt/prosodic/repo
            sudo -u prosodic git fetch origin master
            sudo -u prosodic git checkout master
            sudo -u prosodic git reset --hard origin/master
            sudo -u prosodic git clean -fd prosodic/web/static_build
            sudo -u prosodic /opt/prosodic/.venv/bin/pip install -e . --quiet
            cd prosodic/web/frontend
            sudo -u prosodic npm ci --no-audit --no-fund --silent
            sudo -u prosodic npm run build
            systemctl restart prosodic
            sleep 3
            curl -f -s -o /dev/null http://127.0.0.1:8181/ && echo "health check: OK"