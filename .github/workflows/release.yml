name: "release"

# Deliberate-release path: only fires on a version tag push
# (`git tag v3.3.1 && git push origin v3.3.1`), unlike stable-release.yml
# which runs on every master push (tests + deploy only, no PyPI upload).
on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: "./.github/workflows/unit-tests.yml"  # use the callable tests job to run tests
    secrets: inherit

  pre-release:
    name: "GitHub Release"
    needs: [tests]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Releasing"
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          # No automatic_release_tag: omitting it makes the action use the
          # triggering ref (the pushed vX.Y.Z tag) instead of a rolling tag,
          # so the GitHub Release matches the version actually pushed.
          prerelease: false
          title: "Release ${{ github.ref_name }}"

  # Publishes via PyPI Trusted Publishing (OIDC) — no long-lived token.
  # PyPI side: project prosodic → Settings → Publishing → GitHub publisher
  # (owner quadrismegistus, repo prosodic, workflow release.yml, env pypi).
  # The old PYPI_API_TOKEN secret is unused and can be deleted.
  pypi-release:
    name: "PyPI Release"
    needs: [tests, pre-release]
    runs-on: "ubuntu-latest"
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
