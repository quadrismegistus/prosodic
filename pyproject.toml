[build-system]
requires = ["setuptools>=62.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosodic"
description = "A metrical-phonological parser for poetry, written in Python. For English and Finnish, with flexible language support."
authors = [
    {name = "Ryan Heuser", email = "ryan.heuser@princeton.edu"},
]
readme = "README.md"
license = {text = "Apache License, Version 2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies", "version"]

[project.urls]
"Homepage" = "https://github.com/quadrismegistus/prosodic"
"Project Home" = "https://prosodic.stanford.edu"
"Bug Tracker" = "https://github.com/quadrismegistus/prosodic/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "_version.__version__"}

[tool.setuptools]
packages = {find = {}}
include-package-data = true

[project.optional-dependencies]
# Default phrasal-stress engine: spaCy dependency parse (light).
syntax = [
    "spacy>=3.0",
]
# Faithful L&P engine: Stanza constituency parse (heavy — pulls in torch and
# a large constituency model). Opt-in on top of [syntax]:
#   pip install prosodic[syntax,constituency]
# hashstash[best] adds lmdb + lz4 for the Stanza parse cache (single-file,
# fast); the cache degrades to dep-free pairtree+zlib without them.
constituency = [
    "stanza>=1.5",
    "hashstash[best]",
]
dev = [
    "black>=22.10.0",
    "pre-commit>=2.20.0",
    "tox",
    "sphinx",
    "twine",
    "wheel",
    "pytest-cov",
    "pytest>=7.2",
    "playwright",
]
all = [
    "black>=22.10.0",
    "pre-commit>=2.20.0",
    "tox",
    "sphinx",
    "twine",
    "wheel",
    "pytest-cov",
    "pytest>=7.2",
]

[project.scripts]
prosodic = "prosodic.cli:cli"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with -k \"not slow\")",
]
[tool.coverage.run]
# prosodic/lib/ is vendored third-party (panphon, metricaltree, syllabiphon) —
# not our code, so exclude it from prosodic's coverage figures.
omit = ["prosodic/lib/*", "*/prosodic/lib/*"]
